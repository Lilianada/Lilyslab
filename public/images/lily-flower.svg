<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Leaves -->
  <path d="M150 450 Q200 400 250 450 Q200 500 150 450" class="leaf" fill="#4ade80"/>
  <path d="M550 450 Q600 400 650 450 Q600 500 550 450" class="leaf" fill="#4ade80"/>
  <path d="M200 380 Q250 330 300 380 Q250 430 200 380" class="leaf" fill="#4ade80"/>
  <path d="M500 380 Q550 330 600 380 Q550 430 500 380" class="leaf" fill="#4ade80"/>
  <path d="M250 320 Q300 270 350 320 Q300 370 250 320" class="leaf" fill="#4ade80"/>
  <path d="M450 320 Q500 270 550 320 Q500 370 450 320" class="leaf" fill="#4ade80"/>
  
  <!-- Main Flower Petals -->
  <!-- Back petals -->
  <ellipse cx="320" cy="180" rx="80" ry="140" transform="rotate(-30 320 180)" class="petal back-petal" fill="#e879f9"/>
  <ellipse cx="480" cy="180" rx="80" ry="140" transform="rotate(30 480 180)" class="petal back-petal" fill="#e879f9"/>
  
  <!-- Side petals -->
  <ellipse cx="220" cy="280" rx="70" ry="130" transform="rotate(-60 220 280)" class="petal side-petal" fill="#f0abfc"/>
  <ellipse cx="580" cy="280" rx="70" ry="130" transform="rotate(60 580 280)" class="petal side-petal" fill="#f0abfc"/>
  
  <!-- Front petals -->
  <ellipse cx="300" cy="350" rx="75" ry="135" transform="rotate(-20 300 350)" class="petal front-petal" fill="#f8bbfb"/>
  <ellipse cx="500" cy="350" rx="75" ry="135" transform="rotate(20 500 350)" class="petal front-petal" fill="#f8bbfb"/>
  
  <!-- Center petal -->
  <ellipse cx="400" cy="300" rx="70" ry="120" class="petal center-petal" fill="#fce7f3"/>
  
  <!-- Smaller lily -->
  <ellipse cx="480" cy="120" rx="40" ry="70" transform="rotate(15 480 120)" class="small-petal" fill="#e879f9"/>
  <ellipse cx="520" cy="140" rx="35" ry="65" transform="rotate(45 520 140)" class="small-petal" fill="#f0abfc"/>
  <ellipse cx="540" cy="180" rx="30" ry="60" transform="rotate(75 540 180)" class="small-petal" fill="#f8bbfb"/>
  
  <!-- Flower centers -->
  <circle cx="400" cy="300" r="15" fill="#fbbf24"/>
  <circle cx="400" cy="300" r="8" fill="#f59e0b"/>
  <circle cx="515" cy="145" r="8" fill="#fbbf24"/>
  <circle cx="515" cy="145" r="4" fill="#f59e0b"/>
  
  <!-- Petal details (stamens) -->
  <line x1="400" y1="285" x2="385" y2="270" stroke="#fbbf24" stroke-width="2" class="stamen"/>
  <line x1="400" y1="285" x2="415" y2="270" stroke="#fbbf24" stroke-width="2" class="stamen"/>
  <line x1="400" y1="285" x2="400" y2="265" stroke="#fbbf24" stroke-width="2" class="stamen"/>
  <circle cx="385" cy="270" r="3" fill="#fbbf24" class="anther"/>
  <circle cx="415" cy="270" r="3" fill="#fbbf24" class="anther"/>
  <circle cx="400" cy="265" r="3" fill="#fbbf24" class="anther"/>
</svg>
